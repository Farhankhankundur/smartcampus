server.port=${PORT:8080}
# No DB_URL set -> in-memory H2 (zero setup). On Render set DB_URL, DB_USER, DB_PASSWORD (PostgreSQL).
spring.datasource.url=${DB_URL:jdbc:h2:mem:campus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
# lets Jackson read/write private fields, so model classes need no getter/setter boilerplate
spring.jackson.visibility.field=any
